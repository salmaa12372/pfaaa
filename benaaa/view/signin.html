
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PureBite Auth</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;600&family=EB+Garamond:ital@1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style1.css"/>
</head>

<body>

<canvas id="c"></canvas>

<div class="wrapper">

  <div class="logo">PureBite</div>

  <div class="container" id="cont">
    <div class="form-container sign-up-container">
      <form action="signup.php" method="POST">
        <h1>Create Account</h1>
        <div class="bar"></div>
        <div class="socials">
          <a href="#">f</a>
          <a href="#">G</a>
          <a href="#">in</a>
        </div>

        <span class="or">or use your email</span>

        <div class="field">
          <span>👤</span>
          <input type="text" name="nom" placeholder="Last Name" required />
        </div>

        <div class="field">
          <span>👤</span>
          <input type="text" name="prenom" placeholder="First Name" required />
        </div>

        <div class="field">
          <span>✉</span>
          <input type="email" name="email" placeholder="Email Address" required />
        </div>

        <div class="field">
          <span>📱</span>
          <input type="text" name="telephone" placeholder="Phone Number" />
        </div>

        <div class="field">
          <span>🔒</span>
          <input type="password" name="password" placeholder="Password" required />
        </div>

        <div class="field">
          <span>🔒</span>
          <input type="password" name="confirm_password" placeholder="Confirm Password" required />
        </div>
        <div class="field">
          <span>🎭</span>
          <select name="role" required>
            <option value="">Choose Role</option>
            <option value="CLIENT">Client</option>
            <option value="LIVREUR">Livreur</option>
            <option value="USINE">Usine</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">Begin Journey</button>

      </form>
    </div>
    <div class="form-container sign-in-container">
      <form action="login.php" method="POST">

        <h1>Welcome Back</h1>
        <div class="bar"></div>

        <div class="socials">
          <a href="#">f</a>
          <a href="#">G</a>
          <a href="#">in</a>
        </div>

        <span class="or">or use your account</span>

        <div class="field">
          <span>✉</span>
          <input type="email" name="email" placeholder="Email Address" required />
        </div>

        <div class="field">
          <span>🔒</span>
          <input type="password" name="password" placeholder="Password" required />
        </div>

        <a href="#" class="forgot">Forgot your password?</a>

        <button type="submit" class="btn-submit">Enter the Gate</button>

      </form>
    </div>

    <div class="overlay-container">
      <div class="overlay">

        <div class="overlay-panel overlay-left">
          <div class="rune"><img src=pics/5.png></div>
          <h1>Return, Wanderer</h1>
          <p>The ancient halls remember you. Sign in with your relic credentials.</p>
          <button class="btn-ghost" id="btnIn">Sign In</button>
        </div>

        <div class="overlay-panel overlay-right">
          <div class="rune"><img src=pics/4.png></div>
          <h1>New ?</h1>
          <p>Engrave your name in the annals of the ancients. Begin your legend.</p>
          <button class="btn-ghost" id="btnUp">Sign Up</button>
        </div>

      </div>
    </div>

  </div>
</div>
<script src="app.js"></script>

</body>
</html>
